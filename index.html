<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Minhas Viagens"><title>Minhas Viagens</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f3ef;color:#181818;margin:0}.app{max-width:1080px;margin:auto;padding:18px 15px 90px}.top,.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:27px;font-weight:850}.muted{color:#777;font-size:13px}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 13px;font-weight:750;cursor:pointer}.primary{background:#171717;color:#fff}.hero{background:#171717;color:#fff;border-radius:24px;padding:24px;margin:18px 0}.hero p,.hero small{color:#bbb}.count{font-size:30px;font-weight:850;margin:15px 0}.section{margin-top:25px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.trip,.profilecard,.triphead{background:#fff;border:1px solid #e3dfd8;border-radius:19px;padding:18px}.trip h3{font-size:21px;margin:10px 0}.emoji{font-size:32px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid #ddd;border-radius:15px;padding:14px}.stat b{display:block;font-size:22px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{background:#fff;border:1px solid #ddd;border-radius:15px;padding:15px;text-align:left}.module b{display:block;margin:7px 0}.view{display:none}.view.active{display:block}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;padding:12px;overflow:auto}.modal.open{display:block}.sheet{max-width:900px;margin:3vh auto;background:#fff;border-radius:21px;padding:19px}.sheethead{display:flex;justify-content:space-between}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.field{display:flex;flex-direction:column;gap:5px}.field input,.field textarea{padding:10px;border:1px solid #ddd;border-radius:9px}.day,.item{background:#fff;border:1px solid #e3dfd8;border-radius:14px;padding:12px;margin:8px 0}.event{padding:8px;border-top:1px solid #eee}.tags{display:flex;flex-wrap:wrap;gap:7px}.tag,.pill{background:#f1eee9;border-radius:999px;padding:7px 10px;font-size:12px}.fab{position:fixed;bottom:15px;left:15px;background:#111;color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:800}.danger{color:#a22}.itemactions{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:700px){.grid,.modules,.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="top"><div><div class="brand">✈️ Minhas Viagens</div><div class="muted">Seu agente pessoal de viagens</div></div><button class="btn primary" id="newTrip">＋ Nova viagem</button></header><section id="home" class="view active"><div class="hero"><h1>Próxima viagem</h1><p id="heroTrip">—</p><div class="count" id="count">—</div><small id="heroMeta"></small></div><div class="section"><div class="sectionhead"><h2>🧳 Minhas viagens</h2><button class="btn" id="addTrip">Adicionar</button></div><div id="trips" class="grid"></div></div><div class="section"><div class="sectionhead"><h2>👤 Perfil do viajante</h2><button class="btn" id="editProfile">Editar perfil</button></div><div id="profileCard" class="profilecard"></div></div></section><section id="trip" class="view"><button class="btn" id="back">← Minhas viagens</button><div id="triphead"></div><div class="section"><div class="sectionhead"><h2>O que você quer consultar?</h2><button class="btn" id="editTrip">Editar viagem</button></div><div id="modules" class="modules"></div></div><div class="section"><div class="sectionhead"><h2>🗓️ Roteiro</h2><button class="btn" id="addEvent">＋ Atividade</button></div><div id="timeline"></div></div></section></div><button class="fab" id="quick">✏️ Editar</button><div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="mtitle"></h2><button class="btn" id="close">✕</button></div><div id="mbody"></div></div></div><script>const KEY='minhas_viagens_v2';const deep=x=>JSON.parse(JSON.stringify(x));const base={profile:{originCity:'Londrina',originCountry:'Brasil',destinations:[]},trips:[{id:'texas',emoji:'🤠',name:'Texas 2026',dates:'20–24 dez. 2026',places:'Austin • Bandera',startDate:'2026-12-20T18:00',budget:0,it:[],mods:{compras:[],gastos:[{item:'Passagem AUS → MCO',valor:2871.84,cat:'Passagem'},{item:'Holiday Inn Austin – Town Lake',valor:1667,cat:'Hotel'}],passeios:[],restaurantes:[],reservas:[],notas:[]}},{id:'carneiros',emoji:'🏖️',name:'Praia dos Carneiros 2026',dates:'19–26 out. 2026',places:'Pernambuco',startDate:'2026-10-19T08:00',budget:0,it:[],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}},{id:'curitiba-2026',emoji:'🚗',name:'Curitiba 2026',dates:'Novembro de 2026 • data a definir',places:'Curitiba, PR',startDate:'',budget:0,it:[],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}}]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||deep(base)}catch(e){db=deep(base)};db.profile=db.profile||base.profile;db.profile.destinations=db.profile.destinations||[];db.trips=db.trips||[];base.trips.forEach(x=>{if(!db.trips.some(t=>t.id===x.id))db.trips.push(deep(x))});const texas=db.trips.find(t=>t.id==='texas');if(texas)texas.it=deep(texasRoute);const texasRoute=[['20/12','17:40','✈️ Chegada em Austin','AUS'],['20/12','18:30','🛻 Retirada da Tacoma / Turo','Aeroporto de Austin (AUS)'],['20/12','19:15','🏨 Check-in no Holiday Inn Austin – Town Lake',''],['20/12','20:00','🍖 Jantar / BBQ',''],['21/12','09:00','☕ Café da manhã leve',''],['21/12','10:00','🏛️ Texas State Capitol',''],['21/12','12:00','👢 Lojas western / botas','Cavender’s / Boot Barn'],['21/12','14:30','🌆 South Congress',''],['21/12','18:00','🍖 BBQ',''],['21/12','20:00','💃 Country / Two-Step',''],['22/12','06:30','🛻 Austin → Bandera','~2h10'],['22/12','09:00','🐎 Cavalgada','Bandera Historical Rides'],['22/12','11:00','🍖 Almoço em Bandera',''],['22/12','12:00','🤠 Main Street + lojas western','Souvenirs'],['22/12','15:00','🛻 Bandera → Austin','~2h'],['23/12','10:00','🔫 Shooting range','The Range at Austin'],['23/12','14:00','🛍️ Tarde livre','Compras / descanso'],['23/12','20:00','🎸 Última noite country',''],['24/12','03:10','🏨 Saída do hotel para o AUS',''],['24/12','03:30','🛻 Devolução da Tacoma / Turo','Estacionamento do AUS'],['24/12','04:00','🛄 Chegada ao terminal',''],['24/12','06:00','✈️ Austin → Dallas','Voo doméstico']];
db.trips.forEach(t=>{t.mods=t.mods||{};['compras','gastos','passeios','restaurantes','reservas','notas'].forEach(k=>t.mods[k]=t.mods[k]||[]);t.it=t.it||[]});const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let cur=null,modal=$('modal');function openM(t,b){$('mtitle').textContent=t;$('mbody').innerHTML=b;modal.classList.add('open')}$('close').onclick=()=>modal.classList.remove('open');function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function tripSort(){const now=Date.now();return [...db.trips].sort((a,b)=>{let A=a.startDate?new Date(a.startDate).getTime():NaN,B=b.startDate?new Date(b.startDate).getTime():NaN;let af=Number.isFinite(A)&&A>=now,bf=Number.isFinite(B)&&B>=now;if(af&&bf)return A-B;if(af)return-1;if(bf)return 1;if(!Number.isFinite(A)&&!Number.isFinite(B)){let ma=String(a.dates||'').match(/(janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro).*?(20\d{2})/i),mb=String(b.dates||'').match(/(janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro).*?(20\d{2})/i),ms=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];if(ma&&mb)return(+ma[2]*12+ms.indexOf(ma[1].toLowerCase()))-(+mb[2]*12+ms.indexOf(mb[1].toLowerCase()));if(ma)return-1;if(mb)return 1}return(Number.isFinite(A)?A:Infinity)-(Number.isFinite(B)?B:Infinity)})}function tick(){let n=tripSort().find(t=>t.startDate&&new Date(t.startDate)>new Date());if(!n){$('heroTrip').textContent='Nenhuma viagem futura com data definida';$('count').textContent='—';return}let ms=new Date(n.startDate)-new Date(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);$('heroTrip').textContent=`${n.emoji} ${n.name}`;$('count').textContent=`${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m`;$('heroMeta').textContent='até '+new Date(n.startDate).toLocaleString('pt-BR',{dateStyle:'long',timeStyle:'short'})}function home(){$('trips').innerHTML=tripSort().map(t=>`<article class="trip"><div class="emoji">${t.emoji}</div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.dates)} • ${esc(t.places)}</div><button class="btn" data-open="${t.id}" style="margin-top:12px">Abrir viagem →</button></article>`).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openTrip(b.dataset.open));let d=db.profile.destinations,h=d.reduce((s,x)=>s+(+x.flightHours||0),0),km=d.reduce((s,x)=>s+(+x.roadKm||0),0);$('profileCard').innerHTML=`<b>🌎 Seu histórico de viajante</b><div class="stats"><div class="stat"><b>${new Set(d.map(x=>x.country)).size}</b>Países</div><div class="stat"><b>${d.length}</b>Cidades</div><div class="stat"><b>${h.toFixed(1)}h</b>Horas de voo</div><div class="stat"><b>${Math.round(km)} km</b>De carro</div></div>`;tick()}const defs={compras:['🛍️','Lista de desejos'],gastos:['💰','Gastos'],passeios:['🎟️','Passeios'],restaurantes:['🍖','Comida'],reservas:['📌','Reservas'],notas:['📝','Anotações']};function openTrip(id){cur=db.trips.find(t=>t.id===id);renderTrip();show('trip')}function renderTrip(){let total=cur.mods.gastos.reduce((s,x)=>s+(+x.valor||0),0);$('triphead').innerHTML=`<div class="triphead"><h1>${cur.emoji} ${esc(cur.name)}</h1><div class="muted">${esc(cur.dates)} • ${esc(cur.places)}</div><div class="tags"><span class="pill">💰 Confirmado: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span></div></div>`;$('modules').innerHTML=Object.entries(defs).map(([k,v])=>`<button class="module" data-mod="${k}"><b>${v[0]} ${v[1]}</b>${cur.mods[k].length} item(ns)</button>`).join('');document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>module(b.dataset.mod));$('timeline').innerHTML=cur.it.length?cur.it.map((e,i)=>`<div class="day"><b>${esc(e[0])} ${esc(e[1])}</b><div>${esc(e[2])}</div><small>${esc(e[3])}</small></div>`).join(''):'<p class="muted">Nenhuma atividade.</p>'}function module(k){let a=cur.mods[k],fields=k==='compras'?[['item','Item'],['preco','Preço estimado'],['loja','Loja'],['obs','Observações']]:k==='passeios'?[['item','Passeio'],['data','Data / horário'],['preco','Preço estimado'],['obs','Observações']]:[['item','Descrição'],['valor','Valor'],['obs','Observações']];openM(defs[k][1],`<form id="mf"><div class="fields">${fields.map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}"></div>`).join('')}</div><button class="btn primary" style="margin-top:12px">Adicionar</button></form><div>${a.map((x,i)=>`<div class="item"><b>${esc(x.item)}</b><div class="muted">${esc(x.preco||x.valor||'')} ${esc(x.obs||'')}</div><div class="itemactions">${(k==='compras'&&!x.confirmed)?`<button class="btn" data-confirm="${i}">Marcar como comprado</button>`:''}${(k==='passeios'&&!x.confirmed)?`<button class="btn" data-confirm="${i}">Confirmar passeio</button>`:''}<button class="btn danger" data-del="${i}">Excluir</button></div></div>`).join('')}</div>`);$('mf').onsubmit=e=>{e.preventDefault();let x={};new FormData(e.target).forEach((v,n)=>x[n]=v);x.confirmed=false;a.push(x);save();renderTrip();module(k)};document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{let x=a[+b.dataset.confirm];x.confirmed=true;cur.mods.gastos.push({item:x.item,valor:+x.preco||0,cat:k==='compras'?'Compra':'Passeio',obs:x.obs||''});save();renderTrip();module(k)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.del,1);save();renderTrip();module(k)})}function editTrip(){openM('Editar viagem',`<form id="tf"><div class="fields"><div class="field"><label>Nome</label><input name="name" value="${esc(cur.name)}"></div><div class="field"><label>Datas</label><input name="dates" value="${esc(cur.dates)}"></div><div class="field"><label>Data/hora de início</label><input name="startDate" type="datetime-local" value="${esc(cur.startDate||'')}"></div></div><button class="btn primary">Salvar</button></form>`);$('tf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);cur.name=f.get('name');cur.dates=f.get('dates');cur.startDate=f.get('startDate');save();modal.classList.remove('open');home();renderTrip()}}function newTrip(){openM('Nova viagem',`<form id="nf"><div class="fields"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Destino</label><input name="places"></div><div class="field"><label>Datas</label><input name="dates"></div><div class="field"><label>Data de início</label><input type="datetime-local" name="startDate"></div></div><button class="btn primary">Criar</button></form>`);$('nf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),t={id:'t'+Date.now(),emoji:'✈️',name:f.get('name'),places:f.get('places'),dates:f.get('dates'),startDate:f.get('startDate'),it:[],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}};db.trips.push(t);save();modal.classList.remove('open');home()}}function editProfile(){openM('Perfil do viajante','<p class="muted">O histórico de viagens continua salvo no navegador.</p>')}$('newTrip').onclick=newTrip;$('addTrip').onclick=newTrip;$('editProfile').onclick=editProfile;$('editTrip').onclick=editTrip;$('back').onclick=()=>{show('home');home()};$('addEvent').onclick=()=>{};$('quick').onclick=()=>cur?editTrip():editProfile();home();setInterval(tick,30000);</script></body></html>
