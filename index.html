const $=x=>document.getElementById(x),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let cur=null,modal=$('modal');function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');scrollTo(0,0)}function openM(t,b){$('mtitle').textContent=t;$('mbody').innerHTML=b;modal.classList.add('open')}$('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
function nextTrip(){const now=Date.now();return db.trips.map(t=>({t,ts:t.startDate?new Date(t.startDate).getTime():NaN})).filter(x=>Number.isFinite(x.ts)&&x.ts>now).sort((a,b)=>a.ts-b.ts)[0]||null}function tick(){const n=nextTrip();if(!n){$('heroTitle').textContent='Próxima viagem';$('heroTrip').textContent='Nenhuma viagem futura com data definida';$('count').textContent='—';$('heroMeta').textContent='Adicione a data de início em uma viagem.';return}let ms=Math.max(0,n.ts-Date.now()),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);$('heroTitle').textContent='Próxima viagem';$('heroTrip').textContent=`${n.t.emoji||'✈️'} ${n.t.name}`;$('count').textContent=d+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m';$('heroMeta').textContent='até '+new Date(n.ts).toLocaleString('pt-BR',{dateStyle:'long',timeStyle:'short'})}tick();setInterval(tick,30000);

const defs={compras:['🛍️','Lista de desejos',[['item','Item'],['preco','Preço estimado'],['loja','Loja'],['obs','Observações']]],gastos:['💰','Gastos',[['item','Descrição'],['valor','Valor'],['cat','Categoria'],['obs','Observações']]],passeios:['🎟️','Passeios em pesquisa',[['item','Passeio'],['data','Data / horário'],['preco','Preço'],['obs','Observações']]],restaurantes:['🍖','Comida',[['item','Lugar'],['data','Data / horário'],['orc','Orçamento'],['obs','Observações']]],reservas:['📌','Reservas',[['item','Reserva'],['data','Data / horário'],['obs','Observações']]],notas:['📝','Anotações',[['item','Título'],['obs','Anotação']]]};
function renderTrip(){let total=cur.mods.gastos.reduce((s,x)=>s+(+x.valor||0),0);$('triphead').innerHTML=`<div class="triphead"><div style="font-size:34px">${cur.emoji}</div><h1>${esc(cur.name)}</h1><div class="muted">${esc(cur.dates)} • ${esc(cur.places)}</div><div class="tags"><span class="pill">💰 Confirmado: R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</span><span class="pill">${cur.mods.gastos.length} gasto(s)</span></div></div>`;$('modules').innerHTML=Object.entries(defs).map(([k,v])=>`<button class="module" data-mod="${k}"><span style="font-size:24px">${v[0]}</span><b>${v[1]}</b><span>${cur.mods[k].length} item(ns)</span></button>`).join('');document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>module(b.dataset.mod));let g={};cur.it.forEach((e,i)=>(g[e[0]]??=[]).push({e,i}));$('timeline').innerHTML=Object.entries(g).map(([d,a])=>`<div class="day"><h3>${esc(d)}</h3>${a.map(({e,i})=>`<div class="event"><b>${esc(e[1])}</b><div><b>${esc(e[2])}</b><small>${esc(e[3])}</small></div><div class="itemactions"><button class="btn" data-edit-event="${i}">Editar</button></div></div>`).join('')}</div>`).join('')||'<div class="empty">Nenhuma atividade.</div>';document.querySelectorAll('[data-edit-event]').forEach(b=>b.onclick=()=>editEvent(+b.dataset.editEvent))}
function module(k){let c=defs[k][2],a=cur.mods[k],research=(k==='compras'||k==='passeios'),actionLabel=k==='compras'?'✓ Marcar como comprado':'✓ Confirmar passeio',statusLabel=x=>x.confirmed?'✅ Confirmado':'🔎 Pesquisando';openM(defs[k][0]+' '+defs[k][1],`${research?`<div class="notice">Itens desta lista são apenas planejamento e <b>não entram nos gastos da viagem</b>. Eles só serão contabilizados quando você confirmar a compra ou o passeio.</div>`:''}<form id="mf"><div class="fields">${c.map(f=>`<div class="field ${f[0]==='obs'?'full':''}"><label>${f[1]}</label>${f[0]==='obs'?`<textarea name="${f[0]}" rows="3"></textarea>`:`<input name="${f[0]}" ${f[0]==='valor'||f[0]==='preco'?'type="number" step="0.01"':''}>`}</div>`).join('')}</div><button class="btn primary" style="margin-top:12px">＋ Adicionar</button></form><div class="saved"><b>${research?'Itens planejados':'Itens salvos'}</b>${a.length?a.map((x,i)=>`<div class="item"><div class="itemmain"><b>${esc(x[c[0][0]]||'Sem título')}</b>${research?`<div style="margin:5px 0"><span class="pill">${statusLabel(x)}</span></div>`:''}<div class="muted">${c.slice(1).map(f=>x[f[0]]).filter(Boolean).map(esc).join(' • ')}</div></div><div class="itemactions">${research&&!x.confirmed?`<button class="btn primary" data-confirm="${i}">${actionLabel}</button>`:''}<button class="btn" data-e="${i}">Editar</button><button class="btn danger" data-d="${i}">Excluir</button></div></div>`).join(''):'<p class="muted">Nenhum item.</p>'}</div>`);$('mf').onsubmit=e=>{e.preventDefault();let x={};new FormData(e.target).forEach((v,n)=>x[n]=v);if(research)x.confirmed=false;a.push(x);save();renderTrip();module(k)};document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.d,1);save();renderTrip();module(k)});document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editMod(k,+b.dataset.e));document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{let i=+b.dataset.confirm,x=a[i];if(x.confirmed)return;let value=+(x.preco||0),expenseId=`${k}-${Date.now()}-${i}`;cur.mods.gastos.push({item:k==='compras'?`Compra: ${x.item||'Item'}`:`Passeio: ${x.item||'Passeio'}`,valor:value,cat:k==='compras'?'Compras':'Passeio',obs:x.obs||'',sourceId:expenseId});x.confirmed=true;x.confirmedAt=new Date().toISOString();x.expenseId=expenseId;save();renderTrip();module(k)})}
function editMod(k,i){let c=defs[k][2],x=cur.mods[k][i];openM('Editar '+defs[k][1],`<form id="ef"><div class="fields">${c.map(f=>`<div class="field ${f[0]==='obs'?'full':''}"><label>${f[1]}</label>${f[0]==='obs'?`<textarea name="${f[0]}" rows="4">${esc(x[f[0]]||'')}</textarea>`:`<input name="${f[0]}" value="${esc(x[f[0]]||'')}">`}</div>`).join('')}</div><button class="btn primary" style="margin-top:12px">Salvar</button></form>`);$('ef').onsubmit=e=>{e.preventDefault();let n={};new FormData(e.target).forEach((v,z)=>n[z]=v);if(x.confirmed){n.confirmed=true;n.confirmedAt=x.confirmedAt;n.expenseId=x.expenseId}cur.mods[k][i]=n;save();modal.classList.remove('open');renderTrip()}}
function editEvent(i){let x=cur.it[i];openM('Editar atividade',`<form id="rf"><div class="fields"><div class="field"><label>Data</label><input name="date" value="${esc(x[0])}"></div><div class="field"><label>Horário</label><input name="time" value="${esc(x[1])}"></div><div class="field"><label>Atividade</label><input name="title" value="${esc(x[2])}"></div><div class="field"><label>Observação</label><input name="note" value="${esc(x[3])}"></div></div><button class="btn primary" style="margin-top:12px">Salvar</button> <button type="button" class="btn danger" id="delEvent">Excluir</button></form>`);$('rf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);cur.it[i]=[f.get('date'),f.get('time'),f.get('title'),f.get('note')];save();modal.classList.remove('open');renderTrip()};$('delEvent').onclick=()=>{cur.it.splice(i,1);save();modal.classList.remove('open');renderTrip()}}
function addEvent(){if(!cur)return;openM('＋ Nova atividade',`<form id="af"><div class="fields"><div class="field"><label>Data</label><input name="date"></div><div class="field"><label>Horário</label><input name="time"></div><div class="field"><label>Atividade</label><input name="title"></div><div class="field"><label>Observação</label><input name="note"></div></div><button class="btn primary" style="margin-top:12px">Adicionar</button></form>`);$('af').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);cur.it.push([f.get('date'),f.get('time'),f.get('title'),f.get('note')]);save();modal.classList.remove('open');renderTrip()}}
async function geocode(city,country){try{let r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=10&language=pt&format=json`),j=await r.json(),rs=j.results||[],x=rs.find(z=>country&&String(z.country||'').toLowerCase().includes(country.toLowerCase()))||rs[0];return x?{lat:x.latitude,lon:x.longitude}:null}catch(e){return null}}function hav(a,b){let R=6371,la=(b.lat-a.lat)*Math.PI/180,lo=(b.lon-a.lon)*Math.PI/180,A=Math.sin(la/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lo/2)**2;return 2*R*Math.asin(Math.sqrt(A))}async function estimateFlight(f,fc,t,tc){let[a,b]=await Promise.all([geocode(f,fc),geocode(t,tc)]);if(!a||!b)return{hours:0,km:0};let km=hav(a,b);return{hours:Math.max(.7,km/800+.4),km}}async function estimateRoad(f,fc,t,tc){let[a,b]=await Promise.all([geocode(f,fc),geocode(t,tc)]);if(!a||!b)return{roadKm:0,straightKm:0};let straight=hav(a,b);try{let r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`),j=await r.json(),meters=j.routes&&j.routes[0]&&j.routes[0].distance;if(meters)return{roadKm:meters/1000,straightKm:straight}}catch(e){}return{roadKm:straight*1.2,straightKm:straight}}
function editProfile(){let p=db.profile;openM('👤 Perfil do viajante',`<div class="notice">Cadastre os lugares que você já visitou e escolha como chegou lá. Em avião, o app estima horas de voo. Em carro, estima a distância rodoviária em km.</div><form id="pf"><div class="fields"><div class="field"><label>Origem padrão</label><input name="originCity" value="${esc(p.originCity||'')}"></div><div class="field"><label>País da origem</label><input name="originCountry" value="${esc(p.originCountry||'Brasil')}"></div></div><button class="btn primary" style="margin-top:12px">Salvar origem</button></form><div class="saved"><b>🌎 Adicionar viagem ao perfil</b><form id="df"><div class="transport-toggle"><label><input type="radio" name="transport" value="flight" checked>✈️ Avião</label><label><input type="radio" name="transport" value="car">🚗 Carro</label></div><div class="fields"><div class="field"><label>Cidade visitada</label><input name="city" required></div><div class="field"><label>País</label><input name="country" required></div><div class="field"><label>Origem desta viagem</label><input name="fromCity" value="${esc(p.originCity||'')}"></div><div class="field"><label>País da origem</label><input name="fromCountry" value="${esc(p.originCountry||'Brasil')}"></div></div><button class="btn" id="addDest" style="margin-top:12px">＋ Adicionar ao perfil</button></form><div id="destList"></div></div>`);destList();$('pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);p.originCity=f.get('originCity');p.originCountry=f.get('originCountry');save();home()};$('df').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b=$('addDest'),transport=f.get('transport'),city=f.get('city'),country=f.get('country'),fromCity=f.get('fromCity')||p.originCity,fromCountry=f.get('fromCountry')||p.originCountry;b.disabled=true;b.textContent='Calculando…';if(transport==='car'){let r=await estimateRoad(fromCity,fromCountry,city,country);p.destinations.push({city,country,fromCity,fromCountry,transport:'car',roadKm:r.roadKm})}else{let r=await estimateFlight(fromCity,fromCountry,city,country);p.destinations.push({city,country,fromCity,fromCountry,transport:'flight',flightHours:r.hours,distanceKm:r.km})}save();b.disabled=false;b.textContent='＋ Adicionar ao perfil';destList();home()}}
function destList(){let p=db.profile,l=$('destList');if(!l)return;l.innerHTML=p.destinations.length?p.destinations.map((x,i)=>`<div class="item"><div class="itemmain"><b>${x.transport==='car'?'🚗':'✈️'} ${esc(x.city)}, ${esc(x.country)}</b><div class="muted">${esc(x.fromCity)} → ${esc(x.city)} • ${x.transport==='car'?`${Math.round(+x.roadKm||0).toLocaleString('pt-BR')} km`:`${(+x.flightHours||0).toFixed(1)}h estimadas`}</div></div><button class="btn danger" data-dd="${i}">Excluir</button></div>`).join(''):'<p class="muted">Nenhuma cidade cadastrada.</p>';document.querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{p.destinations.splice(+b.dataset.dd,1);save();destList();home()})}
function editTrip(){if(!cur)return;openM('Editar viagem',`<form id="tf"><div class="fields"><div class="field"><label>Nome</label><input name="name" value="${esc(cur.name)}"></div><div class="field"><label>Emoji</label><input name="emoji" value="${esc(cur.emoji)}"></div><div class="field"><label>Datas</label><input name="dates" value="${esc(cur.dates)}"></div><div class="field"><label>Destino(s)</label><input name="places" value="${esc(cur.places)}"></div><div class="field"><label>Data/hora de início</label><input name="startDate" type="datetime-local" value="${esc(cur.startDate||'')}"></div><div class="field"><label>Orçamento</label><input name="budget" type="number" value="${cur.budget||0}"></div></div><button class="btn primary" style="margin-top:12px">Salvar</button></form>`);$('tf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);cur.name=f.get('name');cur.emoji=f.get('emoji');cur.dates=f.get('dates');cur.places=f.get('places');cur.startDate=f.get('startDate');cur.budget=+f.get('budget')||0;save();modal.classList.remove('open');home();renderTrip();tick()}}
function newTrip(){openM('＋ Nova viagem',`<form id="nf"><div class="fields"><div class="field"><label>Nome</label><input name="name" required></div><div class="field"><label>Emoji</label><input name="emoji" value="✈️"></div><div class="field"><label>Datas</label><input name="dates"></div><div class="field"><label>Destino(s)</label><input name="places"></div><div class="field"><label>Data/hora de início</label><input name="startDate" type="datetime-local"></div></div><button class="btn primary" style="margin-top:12px">Criar viagem</button></form>`);$('nf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),t={id:'t'+Date.now(),name:f.get('name'),emoji:f.get('emoji')||'✈️',dates:f.get('dates'),places:f.get('places'),startDate:f.get('startDate'),status:'Planejada',budget:0,it:[],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}};db.trips.push(t);save();modal.classList.remove('open');home();openTrip(t.id);tick()}}
$('newTrip').onclick=newTrip;$('addTrip').onclick=newTrip;$('editProfile').onclick=editProfile;$('back').onclick=()=>{show('home');home()};$('editTrip').onclick=editTrip;$('addEvent').onclick=addEvent;$('quick').onclick=()=>cur?editTrip():editProfile();home();
</script></body></html>
