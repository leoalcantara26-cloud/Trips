<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Minhas Viagens"><title>Minhas Viagens</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.app{max-width:1000px;margin:auto;padding:20px 15px 80px}button,input,textarea{font:inherit}button{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:27px;font-weight:850}.muted{color:#777;font-size:13px}.btn{border:1px solid #e5e1db;background:#fff;border-radius:11px;padding:10px 13px;font-weight:700}.primary{background:#111;color:#fff;border-color:#111}.hero{background:#171717;color:#fff;border-radius:24px;padding:24px;margin-bottom:25px}.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;color:#bbb}.count{font-size:28px;font-weight:850;margin-top:18px}.count small{display:block;font-size:10px;color:#aaa;text-transform:uppercase}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.trip{background:#fff;border:1px solid #e5e1db;border-radius:19px;padding:18px;min-height:175px;position:relative}.trip .emoji{font-size:32px}.trip h3{font-size:21px;margin:14px 0 4px}.trip-actions{margin-top:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid #e5e1db;border-radius:15px;padding:14px}.stat b{display:block;font-size:22px}.section{margin-top:26px}.section h2{font-size:18px}.view{display:none}.view.active{display:block}.triphead{background:#fff;border:1px solid #e5e1db;border-radius:20px;padding:20px}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.module{text-align:left;background:#fff;border:1px solid #e5e1db;border-radius:15px;padding:15px}.module b{display:block;margin-top:8px}.day{background:#fff;border:1px solid #e5e1db;border-radius:16px;margin:9px 0;overflow:hidden}.day h3{margin:0;padding:12px 14px;background:#faf9f6}.event{display:grid;grid-template-columns:60px 1fr;padding:11px 14px;border-top:1px solid #eee}.event b{font-size:14px}.event small{display:block;color:#777;margin-top:3px}.modal{display:none;position:fixed;inset:0;background:#0009;z-index:100;padding:12px;overflow:auto}.modal.open{display:block}.sheet{max-width:820px;margin:3vh auto;background:#fff;border-radius:21px;padding:19px}.sheethead{display:flex;justify-content:space-between}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#666}.field input,.field textarea{border:1px solid #ddd;border-radius:9px;padding:10px}.saved{border-top:1px solid #eee;margin-top:18px;padding-top:15px}.item{border:1px solid #eee;border-radius:11px;padding:10px;margin:7px 0;display:flex;gap:7px}.itemmain{flex:1}.fab{position:fixed;bottom:14px;left:14px;background:#111;color:#fff;border:0;border-radius:14px;padding:13px 16px;font-weight:800;box-shadow:0 8px 25px #0003}
@media(max-width:650px){.grid,.fields{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.modules{grid-template-columns:1fr 1fr}.field.full{grid-column:auto}.hero h1{font-size:26px}}
</style></head><body>
<div class="app"><div class="top"><div><div class="brand">✈️ Minhas Viagens</div><div class="muted">Seu agente pessoal de viagens</div></div><button class="btn primary" id="new">＋ Nova viagem</button></div>
<section id="home" class="view active"><div class="hero"><h1>Viaje melhor.</h1><p>Planeje, organize e acompanhe suas viagens.</p><div class="count" id="count">—</div><small>até a chegada em Austin • 20/12/2026 às 18:00</small></div>
<div class="section"><div class="top"><h2>🧳 Minhas viagens</h2><button class="btn" id="add">Adicionar</button></div><div id="trips" class="grid"></div></div>
<div class="section"><div class="top"><h2>👤 Perfil de viajante</h2><button class="btn" id="profile">Editar</button></div><div id="stats" class="stats"></div></div></section>
<section id="trip" class="view"><button class="btn" id="back">← Minhas viagens</button><div id="triphead" style="margin-top:12px"></div><div class="section"><h2>O que você quer consultar?</h2><div id="modules" class="modules"></div></div><div class="section"><div class="top"><h2>🗓️ Roteiro</h2><button class="btn" id="editroute">Editar</button></div><div id="timeline"></div></div></section></div>
<button class="fab" id="edit">✏️ Editar</button>
<div id="modal" class="modal"><div class="sheet"><div class="sheethead"><div><h2 id="mtitle" style="margin:0"></h2><div class="muted">Tudo fica salvo neste navegador.</div></div><button class="btn" id="close">✕</button></div><div id="mbody"></div></div></div>
<script>
const KEY="minhas_viagens_v1";const base={profile:{countries:0,cities:0,flights:0,flightHours:0},trips:[
{id:"texas",emoji:"🤠",name:"Texas 2026",dates:"20–24 dez. 2026",places:"Austin • Bandera",status:"Planejada",budget:0,it:[
["20/12","18:00","✈️ Chegada em Austin","AUS → hotel"],["20/12","20:00","🍖 Jantar / BBQ",""],["21/12","09:00","☕ Café leve",""],["21/12","10:00","🏛️ Texas State Capitol",""],["21/12","12:00","👢 Botas + chapéu","Cavender’s / Boot Barn"],["21/12","14:30","🌆 South Congress",""],["21/12","18:00","🍖 BBQ",""],["21/12","20:00","💃 Country / Two-Step",""],["22/12","06:30","🛻 Austin → Bandera","~2h10"],["22/12","09:00","🐎 Cavalgada","Bandera Historical Rides"],["22/12","11:00","🍖 Almoço",""],["22/12","12:00","🤠 Main Street + lojas western",""],["22/12","15:00","🛻 Bandera → Austin","~2h"],["23/12","10:30","🔫 Shooting range",""],["23/12","14:00","🛍️ Tarde livre",""],["23/12","20:00","🎸 Última noite country",""],["24/12","03:30","🛻 Hotel → aeroporto","AUS"],["24/12","06:00","✈️ AUS → Orlando",""]],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}},
{id:"carneiros",emoji:"🏖️",name:"Praia dos Carneiros 2026",dates:"19–26 out. 2026",places:"Pernambuco",status:"Planejada",budget:0,it:[["19/10","","✈️ Chegada",""],["20/10","","🏖️ Praia",""],["26/10","","✈️ Retorno",""]],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}}]};
let db=(()=>{try{return Object.assign(base,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return base}})(),cur=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const modal=$("modal");
function $(x){return document.getElementById(x)}function show(x){document.querySelectorAll(".view").forEach(e=>e.classList.remove("active"));$(x).classList.add("active");scrollTo(0,0)}
function tick(){let ms=Math.max(0,new Date("2026-12-20T18:00:00-06:00")-new Date()),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);$("count").textContent=d+"d "+String(h).padStart(2,"0")+"h "+String(m).padStart(2,"0")+"m"}tick();setInterval(tick,30000);
function home(){ $("trips").innerHTML=db.trips.map(t=>`<article class="trip"><div class="emoji">${t.emoji}</div><h3>${esc(t.name)}</h3><div class="muted">${esc(t.dates)} • ${esc(t.places)}</div><div class="trip-actions"><button class="btn" data-open="${t.id}">Abrir viagem →</button></div></article>`).join("");document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openTrip(b.dataset.open));let p=db.profile;$("stats").innerHTML=[[p.countries,"Países visitados"],[p.cities,"Cidades visitadas"],[p.flights,"Voos registrados"],[p.flightHours+"h","Horas de voo"]].map(x=>`<div class="stat"><b>${x[0]||0}</b><span>${x[1]}</span></div>`).join("")}
function openTrip(id){cur=db.trips.find(t=>t.id===id);renderTrip();show("trip")}
const defs={compras:["🛍️","Compras",[["item","Item"],["preco","Preço estimado"],["loja","Loja"],["obs","Observações"]]],gastos:["💰","Gastos",[["item","Descrição"],["valor","Valor"],["cat","Categoria"],["obs","Observações"]]],passeios:["🎟️","Passeios",[["item","Passeio"],["data","Data / horário"],["preco","Preço"],["obs","Observações"]]],restaurantes:["🍖","Comida",[["item","Lugar"],["data","Data / horário"],["orc","Orçamento"],["obs","Observações"]]],reservas:["📌","Reservas",[["item","Reserva"],["data","Data / horário"],["codigo","Código / localizador"],["obs","Observações"]]],notas:["📝","Anotações",[["item","Título"],["obs","Anotação"]]]};
function renderTrip(){$("triphead").innerHTML=`<div class="triphead"><div style="font-size:35px">${cur.emoji}</div><h1>${esc(cur.name)}</h1><div class="muted">${esc(cur.dates)} • ${esc(cur.places)}</div><button class="btn" style="margin-top:12px" id="tripinfo">Editar viagem</button></div>`;$("tripinfo").onclick=tripInfo;$("modules").innerHTML=Object.entries(defs).map(([k,v])=>`<button class="module" data-mod="${k}"><span style="font-size:25px">${v[0]}</span><b>${v[1]}</b><span>${v[2][0][1]} e mais</span><div class="muted">${cur.mods[k].length} item(ns)</div></button>`).join("");document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>module(b.dataset.mod));let groups={};cur.it.forEach(e=>(groups[e[0]]??=[]).push(e));$("timeline").innerHTML=Object.entries(groups).map(([d,a])=>`<div class="day"><h3>${d}</h3>${a.map(e=>`<div class="event"><div><b>${esc(e[1])}</b></div><div><b>${esc(e[2])}</b><small>${esc(e[3])}</small></div></div>`).join("")}</div>`).join("")}
function openM(t,b){$("mtitle").textContent=t;$("mbody").innerHTML=b;modal.classList.add("open")}$("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
function module(k){let c=defs[k][2],a=cur.mods[k];openM(defs[k][0]+" "+defs[k][1],`<form id="mf"><div class="fields">${c.map(f=>`<div class="field ${f[0]=="obs"?"full":""}"><label>${f[1]}</label>${f[0]=="obs"?`<textarea name="${f[0]}" rows="3"></textarea>`:`<input name="${f[0]}">`}</div>`).join("")}</div><button class="btn primary" style="margin-top:12px">＋ Adicionar</button></form><div class="saved"><b>Itens salvos</b>${a.length?a.map((x,i)=>`<div class="item"><div class="itemmain"><b>${esc(x[c[0][0]]||"Sem título")}</b><div class="muted">${c.slice(1).map(f=>x[f[0]]).filter(Boolean).map(esc).join(" • ")}</div></div><button class="btn" data-e="${i}">Editar</button><button class="btn" data-d="${i}">Excluir</button></div>`).join(""):"<p class='muted'>Nenhum item ainda.</p>"}</div>`);$("mf").onsubmit=e=>{e.preventDefault();let x={};new FormData(e.target).forEach((v,n)=>x[n]=v);a.push(x);save();renderTrip();module(k)};document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{a.splice(+b.dataset.d,1);save();renderTrip();module(k)});document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editMod(k,+b.dataset.e))};
function editMod(k,i){let c=defs[k][2],x=cur.mods[k][i];$("mbody").innerHTML=`<form id="ef"><div class="fields">${c.map(f=>`<div class="field ${f[0]=="obs"?"full":""}"><label>${f[1]}</label>${f[0]=="obs"?`<textarea name="${f[0]}" rows="4">${esc(x[f[0]])}</textarea>`:`<input name="${f[0]}" value="${esc(x[f[0]])}">`}</div>`).join("")}</div><button class="btn primary" style="margin-top:12px">Salvar</button></form>`;$("ef").onsubmit=e=>{e.preventDefault();let n={};new FormData(e.target).forEach((v,k2)=>n[k2]=v);cur.mods[k][i]=n;save();renderTrip();module(k)}}
function tripInfo(){openM("Editar viagem",`<form id="tf"><div class="fields"><div class="field"><label>Nome</label><input name="name" value="${esc(cur.name)}"></div><div class="field"><label>Emoji</label><input name="emoji" value="${esc(cur.emoji)}"></div><div class="field"><label>Datas</label><input name="dates" value="${esc(cur.dates)}"></div><div class="field"><label>Destino(s)</label><input name="places" value="${esc(cur.places)}"></div><div class="field"><label>Orçamento (R$)</label><input name="budget" type="number" value="${cur.budget||0}"></div></div><button class="btn primary" style="margin-top:12px">Salvar</button></form>`);$("tf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);cur.name=f.get("name");cur.emoji=f.get("emoji");cur.dates=f.get("dates");cur.places=f.get("places");cur.budget=+f.get("budget")||0;save();modal.classList.remove("open");home();renderTrip()}}
function profile(){let p=db.profile;openM("👤 Perfil de viajante",`<form id="pf"><div class="fields">${[["countries","Países visitados"],["cities","Cidades visitadas"],["flights","Voos registrados"],["flightHours","Horas de voo"]].map(f=>`<div class="field"><label>${f[1]}</label><input name="${f[0]}" type="number" step=".1" value="${p[f[0]]||0}"></div>`).join("")}</div><button class="btn primary" style="margin-top:12px">Salvar</button></form>`);$("pf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);["countries","cities","flights","flightHours"].forEach(k=>p[k]=+f.get(k)||0);save();modal.classList.remove("open");home()}}
function newTrip(){openM("＋ Nova viagem",`<form id="nf"><div class="fields"><div class="field"><label>Nome</label><input name="name" placeholder="Ex.: Orlando 2027" required></div><div class="field"><label>Emoji</label><input name="emoji" value="✈️"></div><div class="field"><label>Datas</label><input name="dates"></div><div class="field"><label>Destino(s)</label><input name="places"></div><div class="field"><label>Orçamento (R$)</label><input name="budget" type="number"></div></div><button class="btn primary" style="margin-top:12px">Criar viagem</button></form>`);$("nf").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),t={id:"t"+Date.now(),name:f.get("name"),emoji:f.get("emoji")||"✈️",dates:f.get("dates"),places:f.get("places"),status:"Planejada",budget:+f.get("budget")||0,it:[],mods:{compras:[],gastos:[],passeios:[],restaurantes:[],reservas:[],notas:[]}};db.trips.push(t);save();modal.classList.remove("open");home();openTrip(t.id)}}
$("new").onclick=newTrip;$("add").onclick=newTrip;$("profile").onclick=profile;$("back").onclick=()=>{show("home");home()};$("editroute").onclick=()=>{openM("🗓️ Roteiro editável",`<p class="muted">Na próxima versão, cada atividade poderá ser editada diretamente aqui. Por enquanto, o roteiro já está estruturado no app.</p>`)};$("edit").onclick=()=>cur?tripInfo():newTrip();home();
</script></body></html>
